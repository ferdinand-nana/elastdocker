# To Join any other app setup using another network, change name and set external = true
networks:
  default:
    name: elastic
    external: false

# will contain all elasticsearch data.
volumes:
  elasticsearch-data:

secrets:
  elasticsearch.keystore:
    file: ./ksd-secrets/${ENV}/ssl/keystore/elasticsearch.keystore
  elasticsearch.service_tokens:
    file: ./ksd-secrets/${ENV}/ssl/service_tokens
  elastic.ca:
    file: ./ksd-secrets/${ENV}/ssl/certs/ca/ca.crt
  elasticsearch.certificate:
    file: ./ksd-secrets/${ENV}/ssl/certs/elasticsearch/elasticsearch.crt
  elasticsearch.key:
    file: ./ksd-secrets/${ENV}/ssl/certs/elasticsearch/elasticsearch.key
  elasticsearch.http.keystore:
    file: ./ksd-secrets/${ENV}/http/elasticsearch/http.p12
  kibana.certificate:
    file: ./ksd-secrets/${ENV}/ssl/certs/kibana/kibana.crt
  kibana.key:
    file: ./ksd-secrets/${ENV}/ssl/certs/kibana/kibana.key
  kibana.http.ca:
    file: ./ksd-secrets/${ENV}/http/kibana/elasticsearch-ca.pem

services:
  es0:
    image: $KSD_ES_IMAGE_NAME:$KSD_ES_VERSION-$ELK_VERSION-$MACHINE_ARCH
    restart: unless-stopped
    environment:
      ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME}
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_CLUSTER_NAME: ${ELASTIC_CLUSTER_NAME}
      ELASTIC_NODE_NAME: ${ELASTIC_NODE_NAME}
      ELASTIC_INIT_MASTER_NODE: ${ELASTIC_INIT_MASTER_NODE}
      ELASTIC_DISCOVERY_SEEDS: ${ELASTIC_DISCOVERY_SEEDS}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
      ES_JAVA_OPTS: "-Xmx${ELASTICSEARCH_HEAP} -Xms${ELASTICSEARCH_HEAP} -Des.enforce.bootstrap.checks=true -Dlog4j2.formatMsgNoLookups=true"
      bootstrap.memory_lock: "true"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch-master.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/config/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties
    secrets:
      - source: elasticsearch.keystore
        target: /usr/share/elasticsearch/config/elasticsearch.keystore
      - source: elasticsearch.service_tokens
        target: /usr/share/elasticsearch/config/service_tokens
      - source: elastic.ca
        target: /usr/share/elasticsearch/config/certs/ca.crt
      - source: elasticsearch.certificate
        target: /usr/share/elasticsearch/config/certs/elasticsearch.crt
      - source: elasticsearch.key
        target: /usr/share/elasticsearch/config/certs/elasticsearch.key
      - source: elasticsearch.http.keystore
        target: /usr/share/elasticsearch/config/certs/http.p12
    ports:
      - "${ELASTICSEARCH_PORT}:${ELASTICSEARCH_PORT}"
      - "9300:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 200000
        hard: 200000
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf --insecure https://$ELASTIC_USERNAME:$ELASTIC_PASSWORD@localhost:$ELASTICSEARCH_PORT/_cat/health | grep -ioE 'green|yellow' || echo 'not green/yellow cluster status'"]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: $KSD_KIBANA_IMAGE_NAME:$KSD_ES_VERSION-$ELK_VERSION-$MACHINE_ARCH
    restart: unless-stopped
    volumes:
      - ./kibana/config/:/usr/share/kibana/config:ro
    environment:
      ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME}
      KIBANA_SCHEME: ${KIBANA_SCHEME}
      KIBANA_HOST: ${KIBANA_HOST}
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_HOST_PORT: ${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}
      KIBANA_PORT: ${KIBANA_PORT}
    env_file:
      - ./ksd-secrets/${ENV}/ssl/.env.kibana.token
    secrets:
      - source: elastic.ca
        target: /certs/ca.crt
      - source: kibana.certificate
        target: /certs/kibana.crt
      - source: kibana.key
        target: /certs/kibana.key
      - source: kibana.http.ca
        target: /certs/elasticsearch-ca.pem
    ports:
      - "${KIBANA_PORT}:${KIBANA_PORT}"
    links: 
      - "es0:elasticsearch"
    depends_on:
      es0:
        condition: service_healthy
      es1:
        condition: service_healthy
      es2:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"